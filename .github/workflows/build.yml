name: Build NovaOS 

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            nasm \
            grub-pc \
            grub2-common \
            xorriso \
            mtools

      - name: Build OS iso
        run: |
          make

      - name: Upload OS iso
        uses: actions/upload-artifact@v4
        with:
          name: os-iso
          path: NovaOS.iso
